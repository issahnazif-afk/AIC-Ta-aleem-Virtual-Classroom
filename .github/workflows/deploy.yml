name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get the Qaf speech model from the main app (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/models
          gh release download qaaf-asr-model -R issahnazif-afk/Qa-af-Wal-Quran-ul-Majeed -D public/models \
            -p 'qaaf-asr.onnx' -p 'features.json' -p 'vocab.json' --clobber \
            || echo "No speech model published yet; the browser's speech recognition will be used"
      - name: Get the face landmarker model (look-away check)
        run: |
          curl -fsSL --retry 3 -o public/models/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
      # The Sheikh's voice for Alif Ba (letters, syllables, phrases). Made with scripts/voice/make_voice.py and
      # kept in the cache, so it is only made again when that script changes. If clips are committed to
      # public/audio/voice/ they are used as they are. If this step fails the site still works (browser voice).
      - name: Restore the Sheikh's voice clips
        id: voice
        uses: actions/cache@v4
        with:
          path: public/audio/voice
          key: voice-${{ hashFiles('scripts/voice/make_voice.py') }}
      - name: Make the Sheikh's voice clips
        if: steps.voice.outputs.cache-hit != 'true' && hashFiles('public/audio/voice/index.json') == ''
        continue-on-error: true
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 -m pip install --quiet --break-system-packages onnxruntime numpy pyworld "setuptools<81" || python3 -m pip install --quiet onnxruntime numpy pyworld "setuptools<81"
          curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ar_JO-kareem-medium.tar.bz2 | tar xj -C /tmp
          python3 scripts/voice/make_voice.py /tmp/vits-piper-ar_JO-kareem-medium
      # The storyteller voice for Story Time and the Seerah Quest (Kokoro, Apache 2.0, directed sentence by sentence).
      # Every English line is recorded once and kept in the cache; on later deploys only new or changed lines are
      # recorded. The first run takes about 30–40 minutes. The model (from the sherpa-onnx release) is run directly by
      # scripts/voice/kokoro_direct.py so Muslim names keep their real sounds (NAMES in src/lib/narration-text.mjs); the
      # recorder stops if a clip comes out without its words. If this step fails the site still works (the browser's own voice is used).
      - name: List the lines the classroom reads aloud
        run: node scripts/voice/narration-list.mjs
      - name: Restore the narration clips
        id: narration
        uses: actions/cache@v4
        with:
          path: public/audio/narration
          key: narration3-${{ hashFiles('scripts/voice/narration.json', 'scripts/voice/make_narration.py', 'scripts/voice/kokoro_direct.py') }}
          restore-keys: narration3-
      - name: Record the narration with the natural voice
        if: steps.narration.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 -m pip install --quiet --break-system-packages kokoro-onnx onnxruntime numpy soundfile pyworld scipy "setuptools<81" || python3 -m pip install --quiet kokoro-onnx onnxruntime numpy soundfile pyworld scipy "setuptools<81"
          curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2 | tar xj -C /tmp
          python3 scripts/voice/make_narration.py /tmp/kokoro-multi-lang-v1_0
      - name: Build data and site
        env:
          # Settings → Secrets and variables → Actions → Variables → CLASS_LOG_URL
          CLASS_LOG_URL: ${{ vars.CLASS_LOG_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 minutes: the site is about 218 MB and the default 10 minutes has timed out
