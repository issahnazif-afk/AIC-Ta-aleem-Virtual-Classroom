<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow effect -->
  <radialGradient id="lanternGlow" cx="50%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
  </radialGradient>
  <circle cx="32" cy="38" r="28" fill="url(#lanternGlow)"/>
  
  <!-- Lantern body -->
  <rect x="22" y="20" width="20" height="28" rx="3" fill="#C8860A" stroke="#8B5E0A" stroke-width="1.5"/>
  
  <!-- Glass panels (warm glow) -->
  <rect x="24" y="22" width="7" height="24" rx="1" fill="#FFE066" opacity="0.9"/>
  <rect x="33" y="22" width="7" height="24" rx="1" fill="#FFD040" opacity="0.9"/>
  
  <!-- Top cap -->
  <polygon points="20,20 44,20 40,13 24,13" fill="#8B5E0A"/>
  <rect x="29" y="8" width="6" height="6" rx="1" fill="#8B5E0A"/>
  
  <!-- Hook -->
  <path d="M32 8 C32 4 36 4 36 7" fill="none" stroke="#6B4A08" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bottom cap -->
  <ellipse cx="32" cy="48" rx="12" ry="3" fill="#8B5E0A"/>
  
  <!-- Frame lines -->
  <line x1="32" y1="20" x2="32" y2="48" stroke="#8B5E0A" stroke-width="1.5"/>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#8B5E0A" stroke-width="1.5"/>
  
  <!-- Inner flame glow -->
  <ellipse cx="32" cy="34" rx="6" ry="8" fill="#FF9900" opacity="0.5"/>
</svg>
