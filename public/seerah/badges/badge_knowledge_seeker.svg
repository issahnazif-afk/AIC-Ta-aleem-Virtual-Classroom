<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ksBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0A2A"/>
      <stop offset="100%" stop-color="#080510"/>
    </radialGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C090E0"/>
      <stop offset="50%" stop-color="#7040A0"/>
      <stop offset="100%" stop-color="#C090E0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#ksBg)"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#purpleRing)" stroke-width="4"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#7040A0" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Open book -->
  <path d="M28 42 Q28 36 34 36 L60 38 L60 78 Q44 76 34 78 Q28 78 28 72 Z" fill="#4A2060"/>
  <path d="M92 42 Q92 36 86 36 L60 38 L60 78 Q76 76 86 78 Q92 78 92 72 Z" fill="#6A3080"/>

  <!-- Book spine -->
  <line x1="60" y1="38" x2="60" y2="78" stroke="#C090E0" stroke-width="2"/>

  <!-- Left page lines -->
  <line x1="34" y1="48" x2="56" y2="47" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>
  <line x1="34" y1="54" x2="56" y2="53" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>
  <line x1="34" y1="60" x2="56" y2="59" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>
  <line x1="34" y1="66" x2="52" y2="65" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>

  <!-- Right page lines -->
  <line x1="64" y1="47" x2="86" y2="48" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="53" x2="86" y2="54" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="59" x2="86" y2="60" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="65" x2="82" y2="66" stroke="#C090E0" stroke-width="1.5" opacity="0.7"/>

  <!-- Gold star above -->
  <polygon points="60,24 63,34 73,34 65,40 68,50 60,44 52,50 55,40 47,34 57,34" fill="#D4A020"/>

  <!-- Bottom ribbon -->
  <path d="M 24 90 Q 60 102 96 90 L 96 98 Q 60 112 24 98 Z" fill="#5A2080"/>
  <text x="60" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="6" 
        fill="#E8D0FF" font-weight="bold" letter-spacing="0.3">KNOWLEDGE SEEKER</text>
</svg>
